<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Minecraft Server Status</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0d14;
    color: #fff;
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    background-image: radial-gradient(ellipse at 60% 30%, rgba(0, 180, 80, 0.12) 0%, transparent 60%),
                      radial-gradient(ellipse at 20% 80%, rgba(0, 100, 40, 0.10) 0%, transparent 50%);
  }

  .panel {
    background: #13121f;
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 560px;
    box-shadow: 0 0 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 32px;
  }

  .logo-icon {
    width: 52px;
    height: 52px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    box-shadow: 0 0 20px rgba(34,197,94,0.4);
  }

  .logo-text h1 {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 0.5px;
  }

  h2 {
    font-size: 32px;
    font-weight: 900;
    margin-bottom: 6px;
  }

  .subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 28px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }

  input {
    flex: 1;
    padding: 13px 16px;
    background: #1c1b2e;
    border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    color: #fff;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus {
    border-color: #22c55e;
  }

  input::placeholder { color: #555; }

  button {
    padding: 13px 22px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(34,197,94,0.35);
    transition: opacity 0.2s, transform 0.1s;
  }

  button:hover { opacity: 0.9; transform: translateY(-1px); }
  button:active { transform: translateY(0); }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .online-badge {
    background: rgba(34,197,94,0.1);
    color: #22c55e;
    border: 1px solid rgba(34,197,94,0.2);
  }

  .offline-badge {
    background: rgba(255,85,85,0.1);
    color: #ff5555;
    border: 1px solid rgba(255,85,85,0.2);
  }

  .result-card {
    background: #1a1929;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px;
    padding: 20px;
    font-size: 14px;
    line-height: 2;
  }

  .result-card b {
    color: #22c55e;
  }

  .player {
    margin-left: 12px;
    color: #aaa;
    font-size: 13px;
  }

  .server-icon {
    border-radius: 8px;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="panel">
  <div class="logo-row">
    <div class="logo-icon">⛏️</div>
    <div class="logo-text">
      <h1>MC Checker</h1>
    </div>
  </div>

  <h2>Status Serwera</h2>
  <p class="subtitle">Sprawdź dowolny serwer Minecraft</p>

  <div class="input-row">
    <input type="text" id="ip" placeholder="np: hypixel.net">
    <button onclick="checkServer()">SPRAWDŹ</button>
  </div>

  <div id="status"></div>
  <div id="result"></div>
</div>

<script>
function checkServer() {
    const ip = document.getElementById('ip').value;
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = '';
    statusDiv.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'result-card';
    card.innerHTML = 'Ładowanie...';
    resultDiv.appendChild(card);

    fetch(`https://api.mcsrvstat.us/2/${ip}`)
        .then(res => res.json())
        .then(data => {
            if(data.online){
                statusDiv.innerHTML = '<span class="status-badge online-badge">● ONLINE</span>';
                let html = `<b>IP:</b> ${data.ip}:${data.port}<br>`;
                html += `<b>Wersja:</b> ${data.version?.name || data.version || 'unknown'}<br>`;
                html += `<b>Gracze:</b> ${data.players.online}/${data.players.max}<br>`;
                if(data.motd?.html){
                    html += `<b>MOTD:</b><br>${data.motd.html.join('<br>')}<br>`;
                }
                if(data.players.list){
                    html += `<b>Lista graczy:</b><br>`;
                    data.players.list.forEach(p => {
                        html += `<div class="player">• ${p.name}</div>`;
                    });
                }
                if(data.icon){
                    html += `<br><img class="server-icon" src="${data.icon}" width="64">`;
                }
                card.innerHTML = html;
            } else {
                statusDiv.innerHTML = '<span class="status-badge offline-badge">● OFFLINE</span>';
                card.innerHTML = 'Serwer jest offline lub nie istnieje.';
            }
        })
        .catch(err => {
            statusDiv.innerHTML = '<span class="status-badge offline-badge">● BŁĄD</span>';
            card.innerHTML = 'Błąd połączenia z API.';
            console.error(err);
        });
}
</script>
</body>
</html>
